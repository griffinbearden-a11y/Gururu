name: Weekly nflverse refresh

on:
  schedule:
    - cron: '0 10 * * 3' # Wednesday 10:00 UTC — after Monday/Thursday games settle
  workflow_dispatch: {}

concurrency:
  group: poll-and-generate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run ingest:nflverse
      - name: Commit and push if anything changed
        run: |
          git config user.name "daily-guru-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "nflverse: weekly refresh"
          git push
