name: Poll and generate

# Baseline: every 90 minutes, all week (16 runs/day, ~480/month).
# Tightened: every 15 minutes on Sunday afternoons (games) and Tuesday
# mornings (waivers process), adding ~120/month — see brief section 2 for
# the budget math this is built to.
#
# All times UTC. Sunday window approximates 11am-7pm ET; Tuesday window
# approximates 5-8am ET. DST shifts these by an hour for part of the season;
# not worth the complexity of a DST-aware schedule for a 12-man league.
on:
  schedule:
    - cron: '0 0,3,6,9,12,15,18,21 * * *'
    - cron: '30 1,4,7,10,13,16,19,22 * * *'
    - cron: '*/15 16-20 * * 0'
    - cron: '*/15 10-11 * * 2'
  workflow_dispatch: {}

concurrency:
  group: poll-and-generate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Ingest Sleeper data
        env:
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
        run: npm run ingest:sleeper
      - name: Run assignment desk
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run desk:run
      - name: Commit and push if anything changed
        run: |
          git config user.name "daily-guru-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "poll: data + generation update [skip ci]"
          git push
